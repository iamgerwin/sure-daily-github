# Sure Daily GitHub - Configuration Example
# This file demonstrates all available configuration options including
# randomization and multi-repository features

# ========================================
# General Settings
# ========================================
general:
  timezone: "UTC"
  mode: "commit"           # "commit" or "issue"
  dryRun: false            # Test mode without actual commits

  # Daily target can be:
  # 1. A fixed number: dailyTarget: 5
  # 2. A range: dailyTarget: { min: 12, max: 50 }
  dailyTarget: 1           # Fixed count (1-100)
  # dailyTarget:           # Range-based (alternative)
  #   min: 12
  #   max: 50

# ========================================
# Randomization Settings (Optional)
# ========================================
# Uncomment to enable randomization features
# randomization:
#   enabled: true
#
#   # Override issue count with specific range
#   issueCount:
#     min: 12
#     max: 50
#
#   # Time-based variations (optional)
#   timeVariations:
#     enabled: true
#
#     # Per-hour limits
#     hourly:
#       min: 1
#       max: 5
#
#     # Per-day limits
#     daily:
#       min: 10
#       max: 30
#
#     # Per-week limits
#     weekly:
#       min: 50
#       max: 150

# ========================================
# Repository Selection Strategy (Optional)
# ========================================
# Uncomment to enable custom repository selection
# repositorySelection:
#   # Strategy: "sequential", "random", "weighted", "round-robin"
#   strategy: "sequential"
#
#   # Randomize the order each execution
#   randomizeOrder: false
#
#   # Max repositories per execution (null = all)
#   maxPerExecution: null

# ========================================
# Scheduler Configuration
# ========================================
schedule:
  enabled: false           # Enable automatic scheduling
  cron: "0 */6 * * *"     # Every 6 hours
  timezone: "UTC"

  # Common cron patterns:
  # */3 * * * *      - Every 3 minutes
  # */5 * * * *      - Every 5 minutes
  # 0 * * * *        - Every hour
  # 0 */2 * * *      - Every 2 hours
  # 0 */6 * * *      - Every 6 hours
  # 0 9 * * *        - Daily at 9 AM
  # 0 9,17 * * *     - Twice daily (9 AM and 5 PM)

# ========================================
# Conflict Fixer (Optional)
# ========================================
# Used by `sure-daily-github fix-conflicts`: merges the base branch into every
# open PR with merge conflicts, keeps the newer change per conflicting hunk,
# and pushes only if the repository's tests pass. Anything else is reported
# as needs-manual-review. Long test runs share the run lock, so raise
# SDG_RUN_LOCK_STALE_MS if a full pass can exceed 2 hours.
#
# Each attempt is recorded per PR head SHA in data/conflict-fixer-state.json
# (SDG_CONFLICT_FIXER_STATE_FILE overrides the path), so the same commit is
# not cloned and tested again while an attempt is running or cooling down.
#
# Repo gate (opt-in): with no configuration NOTHING is fixed. Per repo, the
# first matching rule wins: repositories[].conflictFixer false -> skipped;
# true -> allowed; listed in denylist -> skipped; mode "allowlist" and not in
# allowlist -> skipped; otherwise allowed. --repo only filters, it never
# bypasses the gate. See docs/CONFLICT_FIXER.md.
# conflictFixer:
#   mode: "allowlist"          # "allowlist" (default) | "denylist" | "all"
#   allowlist:                 # Repos fixed in allowlist mode (default: none)
#     - "yourusername/your-repo"
#   denylist:                  # Always skipped, in every mode
#     - "yourusername/legacy-repo"
#   testTimeoutMinutes: 15     # Per install/test command
#   installDeps: true          # Install from the npm, pnpm or yarn lockfile first
#   scanTimeoutSeconds: 120    # Budget for listing PRs across all repos
#                              # (incl. UNKNOWN re-polls); override per run
#                              # with --scan-timeout <seconds>. Unscanned
#                              # repos are reported as scan-timeout.
#   attemptTtlMinutes: 60      # An in-progress attempt older than this is stale
#   retryCooldownMinutes: 240  # Skip re-attempting the same head SHA this long
#   sourceHunks: "push"        # Non-test conflicts: "push" (newer wins, default)
#                              # | "claude" (left for the pr-maint Claude worker)
#                              # | "escalate" (needs-manual-review). Test-file
#                              # conflicts always keep both sides' added lines.

# ========================================
# Babysit (Optional) - see docs/BABYSIT.md
# ========================================
# Addresses review comments on open PRs carrying the label: triages each
# comment with an AI engine, pushes tested fixes, and replies on every thread.
# Never merges. Run ad hoc with `sure-daily-github babysit`.
babysit:
  enabled: false              # Also scan on every scheduler tick
  label: babysit              # Label that marks a PR for babysitting
  engine: opencode            # opencode | claude
  model: openai/gpt-6.1-sol   # Passed to the engine as --model
  ownPRsOnly: true            # Only PRs authored by the token's user
  maxPrsPerRun: 5
  testTimeoutMinutes: 15      # Test gate timeout (uses repositories[].testCommand)
  engineTimeoutMinutes: 30    # Per engine invocation

# ========================================
# Repositories
# ========================================
repositories:
  # Basic example
  - owner: "yourusername"
    repo: "your-repo"
    enabled: true
    branch: "main"
    dailyTarget: 1
    path: "daily-updates"  # For commit mode
    commitMessage: "docs: daily update ${date}"
    labels: ["automated"]  # For issue mode
    weight: 1              # For weighted selection
    # testCommand: "npm run test:unit"  # fix-conflicts and babysit test gate: overrides test detection
    # conflictFixer: true    # fix-conflicts: per-repo opt in (true) / out (false); beats mode and lists

  # Example with range-based target
  # - owner: "yourusername"
  #   repo: "another-repo"
  #   enabled: true
  #   branch: "main"
  #   dailyTarget:
  #     min: 5
  #     max: 15
  #   weight: 40
  #   labels: ["automated", "high-priority"]

  # Example with higher weight
  # - owner: "yourusername"
  #   repo: "important-repo"
  #   enabled: true
  #   branch: "main"
  #   dailyTarget: 10
  #   weight: 50
  #   labels: ["automated", "critical"]

# ========================================
# Content Template
# ========================================
contentTemplate:
  # Variables: ${date}, ${time} (in general.timezone), ${timestamp} (UTC ISO)
  title: "Daily Update"
  body: |
    # Daily Progress - ${date}

    Automated daily update for tracking activity.

    ## Status
    - System operational
    - Update created at ${time}

    ---
    Generated at ${timestamp}
